spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clearcareai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:myDefaultSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  omnidim:
    api-key: ${OMNIDIM_API_KEY:}
    agent-id: ${OMNIDIM_AGENT_ID:}
    base-url: ${OMNIDIM_BASE_URL:https://api.omnidim.io/v1}
  fastapi:
    base-url: ${FASTAPI_URL:http://localhost:8000}
  voicereview:
    initial-delay-days: ${VOICE_REVIEW_DELAY_DAYS:7}
    retry-gap-hours: ${VOICE_REVIEW_RETRY_GAP_HOURS:1}
    max-attempts: ${VOICE_REVIEW_MAX_ATTEMPTS:3}
    check-interval-ms: ${VOICE_REVIEW_CHECK_INTERVAL_MS:600000}
